name: Harness

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited]
  schedule:
    - cron: "0 0 * * 1"

concurrency:
  group: harness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  invariants:
    name: Repository Invariants
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install mobile dependencies
        working-directory: apps/mobile
        run: npm ci

      - name: Run harness script tests
        run: bash scripts/harness/harness.test.sh

      - name: Validate stored change-manifest history
        if: github.event_name != 'pull_request'
        run: scripts/harness/validate-all.sh

      - name: Validate pull request change manifest and evidence
        if: github.event_name == 'pull_request'
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          bash scripts/development/validate-change-manifest.sh --pr "$GITHUB_WORKSPACE" "$PR_BASE" "$PR_HEAD" "$PR_BODY"
          scripts/harness/validate-all.sh
