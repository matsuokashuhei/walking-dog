name: Harness

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 0 * * 1"

concurrency:
  group: harness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  invariants:
    name: Repository Invariants
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install mobile dependencies
        working-directory: apps/mobile
        run: npm ci

      - name: Run harness script tests
        run: bash scripts/harness/harness.test.sh

      - name: Validate knowledge, architecture, quality, and Knip
        run: scripts/harness/validate-all.sh
