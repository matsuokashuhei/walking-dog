name: API Required Checks

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

concurrency:
  group: api-required-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect API changes
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'apps/api/**'
              - 'scripts/harness/**'
              - '.github/workflows/test-api.yml'

  architecture:
    name: API / Architecture
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - if: needs.changes.outputs.api == 'true'
        uses: actions/checkout@v6
      - if: needs.changes.outputs.api == 'true'
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy,rustfmt
      - if: needs.changes.outputs.api == 'true'
        working-directory: apps/api
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo xtask architecture check
      - if: needs.changes.outputs.api != 'true'
        run: echo 'No API changes; stable check passes.'

  contracts:
    name: API / Domain and Application Contracts
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - if: needs.changes.outputs.api == 'true'
        uses: actions/checkout@v6
      - if: needs.changes.outputs.api == 'true'
        uses: dtolnay/rust-toolchain@1.96.0
      - if: needs.changes.outputs.api == 'true'
        working-directory: apps/api
        run: cargo test --locked -p domain -p application
      - if: needs.changes.outputs.api != 'true'
        run: echo 'No API changes; stable check passes.'

  adapters:
    name: API / Adapter Integration
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - if: needs.changes.outputs.api == 'true'
        uses: actions/checkout@v6
      - if: needs.changes.outputs.api == 'true'
        uses: dtolnay/rust-toolchain@1.96.0
      - if: needs.changes.outputs.api == 'true'
        working-directory: apps/api
        run: cargo test --locked -p adapter-postgres -p integration-test-support -p harness-runtime
      - if: needs.changes.outputs.api != 'true'
        run: echo 'No API changes; stable check passes.'

  graphql:
    name: API / GraphQL Schema and Journeys
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - if: needs.changes.outputs.api == 'true'
        uses: actions/checkout@v6
      - if: needs.changes.outputs.api == 'true'
        uses: dtolnay/rust-toolchain@1.96.0
      - if: needs.changes.outputs.api == 'true'
        working-directory: apps/api
        run: cargo test --locked -p adapter-graphql -p api-bootstrap
      - if: needs.changes.outputs.api != 'true'
        run: echo 'No API changes; stable check passes.'

  repository:
    name: Repository / Harness Invariants
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - if: needs.changes.outputs.api == 'true'
        uses: dtolnay/rust-toolchain@1.96.0
      - if: needs.changes.outputs.api == 'true'
        run: |
          scripts/harness/harness.test.sh
          scripts/harness/validate-all.sh
      - if: needs.changes.outputs.api != 'true'
        run: echo 'No API changes; stable check passes.'
