name: API Required Checks

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

concurrency:
  group: api-required-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect API changes
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'apps/api/**'
              - 'scripts/harness/**'
              - 'infra/sakura/compose.yml'
              - 'infra/sakura/deploy.sh'
              - 'infra/sakura/.env.example'
              - 'infra/sakura/README.md'
              - '.github/workflows/test-api.yml'

  architecture:
    name: API / Architecture
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - if: needs.changes.outputs.api == 'true'
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - if: needs.changes.outputs.api == 'true'
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy,rustfmt
      - if: needs.changes.outputs.api == 'true'
        working-directory: apps/api
        env:
          ARCHITECTURE_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          ARCHITECTURE_HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --lib --bins --examples --all-features --locked -- -D warnings
          cargo clippy --workspace --tests --all-features --locked -- -D warnings -A clippy::unwrap_used -A clippy::expect_used
          cargo test --locked -p architecture-validator --all-targets --all-features
          cargo test --locked -p xtask --all-targets --all-features
          cargo xtask image-catalog generate
          cargo xtask image-catalog verify
          cargo xtask image-catalog generate
          git diff --exit-code -- tools/harness-runtime/src/generated_postgres.rs
          if [[ "$ARCHITECTURE_BASE" =~ ^0+$ ]]; then
            ARCHITECTURE_BASE="$(git rev-parse "$ARCHITECTURE_HEAD^")"
          fi
          cargo xtask architecture check --base "$ARCHITECTURE_BASE" --head "$ARCHITECTURE_HEAD"
      - if: needs.changes.outputs.api != 'true'
        run: echo 'No API changes; stable check passes.'

  contracts:
    name: API / Domain and Application Contracts
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - if: needs.changes.outputs.api == 'true'
        uses: actions/checkout@v6
      - if: needs.changes.outputs.api == 'true'
        uses: dtolnay/rust-toolchain@1.96.0
      - if: needs.changes.outputs.api == 'true'
        working-directory: apps/api
        run: cargo test --locked -p domain -p application
      - if: needs.changes.outputs.api != 'true'
        run: echo 'No API changes; stable check passes.'

  adapters:
    name: API / Adapter Integration
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - if: needs.changes.outputs.api == 'true'
        uses: actions/checkout@v6
      - if: needs.changes.outputs.api == 'true'
        uses: dtolnay/rust-toolchain@1.96.0
      - if: needs.changes.outputs.api == 'true'
        working-directory: apps/api
        run: cargo test --locked -p adapter-postgres -p integration-test-support -p harness-runtime
      - if: needs.changes.outputs.api != 'true'
        run: echo 'No API changes; stable check passes.'

  graphql:
    name: API / GraphQL Schema and Journeys
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - if: needs.changes.outputs.api == 'true'
        uses: actions/checkout@v6
      - if: needs.changes.outputs.api == 'true'
        uses: dtolnay/rust-toolchain@1.96.0
      - if: needs.changes.outputs.api == 'true'
        working-directory: apps/api
        run: cargo test --locked -p adapter-graphql -p api-bootstrap
      - if: needs.changes.outputs.api != 'true'
        run: echo 'No API changes; stable check passes.'

  repository:
    name: Repository / Harness Invariants
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - if: needs.changes.outputs.api == 'true'
        uses: dtolnay/rust-toolchain@1.96.0
      - if: needs.changes.outputs.api == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 22.17.0
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - if: needs.changes.outputs.api == 'true'
        working-directory: apps/mobile
        run: npm ci
      - if: needs.changes.outputs.api == 'true'
        run: docker build -f apps/api/Dockerfile -t walking-dog-api-kernel:ci apps/api
      - if: needs.changes.outputs.api == 'true'
        run: |
          scripts/harness/harness.test.sh
          scripts/harness/validate-all.sh
          scripts/harness/verify-production-images.sh walking-dog-api-kernel:ci
      - if: needs.changes.outputs.api != 'true'
        run: echo 'No API changes; stable check passes.'
