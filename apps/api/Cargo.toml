[package]
edition = "2024"
name = "walking-dog"
version = "0.1.0"
default-run = "walking-dog"

[features]
# Test-only helpers. Currently empty (the helpers were dropped in the API
# rewrite) but kept so `cargo test --features test-utils` in CI stays valid.
test-utils = []

[dependencies]
migration = { path = "./migration" }

axum = { version = "0.8.9" }
axum-extra = { version = "0.12.6", features = ["typed-header"] }
async-graphql = { version = "7.2.1", features = ["chrono", "uuid", "url", "tracing"] }
async-graphql-axum = { version = "7.2.1" }
tokio = { version = "1.52.2", features = ["macros", "rt-multi-thread", "sync", "time"] }
tracing = { version = "0.1.44" }
tracing-subscriber = { version = "0.3.23" }
aws-config = { version = "1.8.16", features = ["behavior-version-latest"] }
aws-sdk-dynamodb = "1.111.0"
aws-sdk-s3 = { version = "1.132.0", features = ["behavior-version-latest"] }
aws-sdk-sqs = "1.98.0"
aws-sdk-cognitoidentityprovider = "1.116.0"
chrono = { version = "0.4.44", default-features = false, features = ["serde", "std"] }
anyhow = "1.0.102"
uuid = { version = "1.23.1", features = ["serde", "v7"] }
jsonwebtoken = { version = "10.3.0", features = ["aws_lc_rs"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.149" }
reqwest = { version = "0.13.3", features = ["json"] }
url = "2.5.8"
thiserror = "2.0.18"


[dependencies.sea-orm]
version = "~2.0.0-rc"
features = [
    "sqlx-postgres",
    "runtime-tokio-native-tls",
    "debug-print",
    "with-bigdecimal",
    "with-chrono",
    "with-json",
    "with-uuid",
]

# [dependencies.seaography]
# version = "~2.0.0-rc.8" # seaography version
# features = ["graphql-playground", "with-decimal", "with-chrono", "with-uuid"]

[dev-dependencies]
serde_json = { version = "1.0.103" }

[workspace]
members = [".", "migration"]
