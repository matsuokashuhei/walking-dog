[package]
name = "api-bootstrap"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
adapter-aws-cognito = { path = "../adapter-aws-cognito" }
adapter-aws-dynamodb = { path = "../adapter-aws-dynamodb" }
adapter-aws-s3 = { path = "../adapter-aws-s3" }
adapter-aws-sqs = { path = "../adapter-aws-sqs" }
adapter-graphql = { path = "../adapter-graphql" }
adapter-postgres = { path = "../adapter-postgres" }
application = { path = "../application" }
axum = "0.8.4"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.12"
tokio = { version = "1.45.1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "fmt", "json"] }

[lints]
workspace = true
