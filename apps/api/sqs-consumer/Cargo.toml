[package]
name = "sqs-consumer"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1.89"
aws-sdk-sqs = "1.101.0"
futures = "0.3.31"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread", "sync", "time", "signal", "test-util"] }
tracing = "0.1.44"

[dev-dependencies]
aws-config = { version = "1.8.18", features = ["behavior-version-latest"] }
nix = { version = "0.31", features = ["signal"] }
