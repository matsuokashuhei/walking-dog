[package]
name = "architecture-validator"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "architecture-validator"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
cargo_metadata = "0.23.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
syn = { version = "2.0.117", features = ["full", "visit"] }
toml = "0.9.8"

[lints]
workspace = true
