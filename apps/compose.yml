services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: walking_dog
      POSTGRES_PASSWORD: password
      POSTGRES_DB: walking_dog_dev
    ports:
      - "${WD_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U walking_dog -d walking_dog_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  dynamodb-local:
    image: amazon/dynamodb-local:latest
    user: root
    command: -jar DynamoDBLocal.jar -sharedDb -dbPath /data
    ports:
      - "${WD_DYNAMODB_PORT:-8000}:8000"
    volumes:
      - dynamodb_data:/data

  # dynamodb-admin:
  #   image: aaronshaf/dynamodb-admin:latest
  #   ports:
  #     - "8001:8001"
  #   environment:
  #     DYNAMO_ENDPOINT: http://dynamodb-local:8000
  #   env_file:
  #     - .env.local
  #   depends_on:
  #     dynamodb-local:
  #       condition: service_started

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "${WD_MINIO_PORT:-9000}:9000"
      - "${WD_MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/avatars &&
      mc anonymous set download local/avatars &&
      mc mb --ignore-existing local/photos &&
      mc anonymous set download local/photos
      "

  elasticmq:
    image: softwaremill/elasticmq-native:latest
    ports:
      - "${WD_ELASTICMQ_PORT:-9324}:9324"
      - "${WD_ELASTICMQ_UI_PORT:-9325}:9325"
    volumes:
      - ./elasticmq/elasticmq.conf:/opt/elasticmq.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9324/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: ./api/Dockerfile
      target: dev
    working_dir: /walking-dog/apps/api
    command: ["cargo", "watch", "-x", "run --bin walking-dog"]
    ports:
      - "${WD_API_PORT:-3000}:3000"
    volumes:
      - ..:/walking-dog
      - cargo_cache:/usr/local/cargo
      - target_cache:/walking-dog/apps/api/target
      - ${HOME}/.aws:/root/.aws:ro
    env_file:
      - ${WD_API_ENV_FILE:-api/.env.local}
    depends_on:
      postgres:
        condition: service_healthy
      dynamodb-local:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
      elasticmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5

  track-point-worker:
    build:
      context: .
      dockerfile: ./api/Dockerfile
      target: dev
    working_dir: /walking-dog/apps/api
    command: ["cargo", "watch", "-x", "run --bin track_point_worker"]
    volumes:
      - ..:/walking-dog
      - cargo_cache:/usr/local/cargo
      - target_cache:/walking-dog/apps/api/target
      - ${HOME}/.aws:/root/.aws:ro
    env_file:
      - ${WD_API_ENV_FILE:-api/.env.local}
    depends_on:
      dynamodb-local:
        condition: service_started
      elasticmq:
        condition: service_healthy

volumes:
  postgres_data:
  dynamodb_data:
  minio_data:
  cargo_cache:
  target_cache:
