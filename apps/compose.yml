services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: walking_dog
      POSTGRES_PASSWORD: password
      POSTGRES_DB: walking_dog_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U walking_dog -d walking_dog_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  dynamodb-local:
    image: amazon/dynamodb-local:latest
    user: root
    command: -jar DynamoDBLocal.jar -sharedDb -dbPath /data
    ports:
      - "8000:8000"
    volumes:
      - dynamodb_data:/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/dog-photos &&
      mc anonymous set download local/dog-photos
      "

  elasticmq:
    image: softwaremill/elasticmq-native:latest
    ports:
      - "9324:9324"
      - "9325:9325"
    volumes:
      - ./elasticmq/elasticmq.conf:/opt/elasticmq.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9324/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  cognito-local:
    image: jagregory/cognito-local:latest
    ports:
      - "9229:9229"
    volumes:
      - ./cognito-local/db:/app/.cognito/db

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
      target: dev
    command: ["cargo", "watch", "-x", "run --bin walking-dog-api"]
    ports:
      - "3000:3000"
    volumes:
      - ./api:/apps/api
      - cargo_cache:/usr/local/cargo
      - target_cache:/apps/api/target
    env_file:
      - ./api/.env.local
    depends_on:
      postgres:
        condition: service_healthy
      dynamodb-local:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
      elasticmq:
        condition: service_healthy
      cognito-local:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: ./api
      dockerfile: Dockerfile.dev
    command: ["cargo", "watch", "-x", "run --bin walk_points_worker"]
    volumes:
      - ./api:/apps/api
      - cargo_cache:/usr/local/cargo
      - target_cache:/apps/api/target
    env_file:
      - ./api/.env.local
    depends_on:
      postgres:
        condition: service_healthy
      dynamodb-local:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
      elasticmq:
        condition: service_healthy
      cognito-local:
        condition: service_started

  schemaspy:
    image: schemaspy/schemaspy
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./schemaspy/schemaspy.properties:/schemaspy.properties
      - ./schemaspy/output:/output

  web:
    image: nginx
    ports:
      - "1433:80"
    volumes:
      - ./schemaspy/output:/usr/share/nginx/html

volumes:
  postgres_data:
  dynamodb_data:
  minio_data:
  cargo_cache:
  target_cache:
