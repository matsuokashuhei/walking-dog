[package]
edition = "2024"
name = "walking-dog"
version = "0.1.0"

[dependencies]
migration = { path = "./migration" }

axum = { version = "0.8.9" }
async-graphql-axum = { version = "7.0.19" }
tokio = { version = "1.52.1", features = ["macros", "rt-multi-thread", "time"] }
tracing = { version = "0.1.44" }
tracing-subscriber = { version = "0.3.23" }
aws-config = { version = "1.8.16", features = ["behavior-version-latest"] }
aws-sdk-dynamodb = "1.111.0"
aws-sdk-s3 = { version = "1.131.0", features = ["behavior-version-latest"] }
aws-sdk-sqs = "1.98.0"
aws-sdk-cognitoidentityprovider = "1.116.0"
chrono = { version = "0.4.44", default-features = false, features = ["std"] }
# aws-smithy-types = "1.4.7"
# aws-smithy-runtime-api = { version = "1.12.0", features = ["client"] }
# aws-types = "1.3.15"

[dependencies.sea-orm]
version = "~2.0.0-rc"
features = ["sqlx-postgres", "runtime-tokio-native-tls", "seaography"]
# features = [ "sqlx-postgres", "runtime-tokio-native-tls", "macros", "debug-print", "mock", "seaography", "with-chrono", "with-json", "with-uuid" ]

[dependencies.seaography]
version = "~2.0.0-rc.8" # seaography version
features = ["graphql-playground", "with-decimal", "with-chrono", "with-uuid"]

[dev-dependencies]
serde_json = { version = "1.0.103" }

[workspace]
members = [".", "migration"]
