# Harness preconditions:
# - App is installed as com.walkingdog.app and points to the intended API.
# - Simulator language is English.
# - Cognito-local or dev Cognito can create the email below.
# - If confirmation is required, the harness exposes the verification code.
appId: com.walkingdog.app
name: Auth Onboarding
tags:
  - harness
  - auth
  - journey
env:
  E2E_NAME: Harness Owner
  E2E_EMAIL: harness-auth@example.com
  E2E_PASSWORD: Password123
  E2E_NEW_PASSWORD: Newpass1
  E2E_CONFIRMATION_CODE: "123456"
---
- launchApp:
    clearState: true
- assertVisible: Walking Dog
- tapOn: Create an account
- assertVisible: Create Account
- tapOn:
    id: register-displayName
- inputText: ${E2E_NAME}
- tapOn:
    id: register-email
- inputText: ${E2E_EMAIL}
- tapOn:
    id: register-password
- inputText: ${E2E_PASSWORD}
- tapOn: Continue
- runFlow:
    when:
      visible: Email Verification
    commands:
      - tapOn: "1"
      - tapOn: "2"
      - tapOn: "3"
      - tapOn: "4"
      - tapOn: "5"
      - tapOn: "6"
      - tapOn: Confirm
- extendedWaitUntil:
    visible: Welcome back
    timeout: 15000
- tapOn:
    id: login-email
- inputText: ${E2E_EMAIL}
- tapOn:
    id: login-password
- inputText: ${E2E_PASSWORD}
- tapOn: Sign in
- waitForAnimationToEnd:
    timeout: 5000
- runFlow:
    when:
      visible: Save Password?
    commands:
      - tapOn: Not Now
- extendedWaitUntil:
    visible: No dogs yet
    timeout: 15000
- assertVisible: Walk
- assertVisible: Me
- tapOn: Me
- tapOn:
    id: user-change-password-row
- assertVisible: Change password
- tapOn:
    id: change-password-current
- inputText: ${E2E_PASSWORD}
- tapOn:
    id: change-password-new
- inputText: ${E2E_NEW_PASSWORD}
- tapOn:
    id: change-password-confirm
- inputText: ${E2E_NEW_PASSWORD}
- tapOn:
    id: change-password-submit
- extendedWaitUntil:
    visible: Welcome back
    timeout: 15000
- takeScreenshot: harness-auth-onboarding
