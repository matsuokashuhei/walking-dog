# Harness preconditions:
# - App is installed as com.walkingdog.app and points to the intended API.
# - Simulator language is English.
# - Cognito-local or dev Cognito can send the one-time password below.
appId: com.walkingdog.app
name: Auth Onboarding
tags:
  - harness
  - auth
  - journey
env:
  E2E_EMAIL: harness-passwordless@example.com
  E2E_CONFIRMATION_CODE: "123456"
---
- launchApp:
    clearState: true
- assertVisible: Walking Dog
- runFlow:
    when:
      visible: Development Build
    commands:
      - tapOn: "http://.*:8081"
- tapOn:
    point: "50%,91%"
- tapOn: Continue
- tapOn:
    point: "88%,48%"
- waitForAnimationToEnd:
    timeout: 5000
- extendedWaitUntil:
    visible: Continue with email
    timeout: 30000
- tapOn:
    id: auth-email
- inputText: ${E2E_EMAIL}
- pressKey: Enter
- runFlow:
    when:
      visible: Continue with email
    commands:
      - hideKeyboard
      - tapOn:
          id: auth-continue-email
- extendedWaitUntil:
    visible: Check your email
    timeout: 15000
- tapOn:
    id: one-time-password
- inputText: ${E2E_CONFIRMATION_CODE}
- waitForAnimationToEnd:
    timeout: 5000
- extendedWaitUntil:
    visible: No dogs yet
    timeout: 15000
- assertVisible: Walk
- assertVisible: Me
- takeScreenshot: harness-auth-onboarding
