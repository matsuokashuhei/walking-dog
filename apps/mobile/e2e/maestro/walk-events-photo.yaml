# Harness preconditions:
# - Owner is authenticated by saved app auth state; do not clear app state.
# - A dog named Harness Event Dog exists and a walk can be started.
# - Camera permission and photo capture are controlled by the harness.
# - Local storage service is running when photo upload is exercised.
appId: com.walkingdog.app
name: Walk Events And Photo
tags:
  - harness
  - walk-events-photo
  - journey
env:
  DOG_NAME: Harness Event Dog
---
- launchApp:
    clearState: false
- runFlow:
    when:
      visible: Goal progress
    commands:
      - tapOn:
          point: 11%,9%
- tapOn: Walk
- assertVisible: Walk
- assertVisible: ${DOG_NAME}
- tapOn: ${DOG_NAME}
- tapOn: START WALK
- extendedWaitUntil:
    visible: LIVE
    timeout: 15000
- tapOn: Pee
- tapOn: Poop
- tapOn: Photo
- runFlow:
    when:
      visible: OK
    commands:
      - tapOn: OK
- assertVisible: End Walk
- tapOn:
    id: walk-end-slider-visual
- extendedWaitUntil:
    visible: Walk Detail
    timeout: 15000
- assertVisible: Distance
- assertVisible: Time
- assertVisible: Pace
- takeScreenshot: harness-walk-events-photo
