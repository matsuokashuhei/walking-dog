# Harness preconditions:
# - Owner is authenticated by saved app auth state; do not clear app state.
# - At least one dog named Harness Walker exists and is selectable for walking.
# - Location permission is granted or controlled by the harness.
# - GPS replay or simulator location is configured before START WALK.
appId: com.walkingdog.app
name: Walk Lifecycle
tags:
  - harness
  - walk-lifecycle
  - journey
env:
  DOG_NAME: Harness Walker
---
- launchApp:
    clearState: false
- runFlow:
    when:
      visible: Goal progress
    commands:
      - tapOn:
          point: 11%,9%
- tapOn: Walk
- assertVisible: Walk
- assertVisible: ${DOG_NAME}
- tapOn: ${DOG_NAME}
- tapOn: START WALK
- extendedWaitUntil:
    visible: LIVE
    timeout: 15000
- assertVisible: Time
- assertVisible: Distance
- assertVisible: End Walk
- swipe:
    start: 13%,84%
    end: 91%,84%
    duration: 2500
- extendedWaitUntil:
    visible: Walk Complete!
    timeout: 15000
- tapOn: Save walk
- extendedWaitUntil:
    visible: Recent Walks
    timeout: 15000
- takeScreenshot: harness-walk-lifecycle
