sonar.projectKey=walking-dog-local
sonar.projectName=walking-dog local
sonar.sourceEncoding=UTF-8
sonar.scm.disabled=true

sonar.sources=apps/api/crates,apps/api/tools,apps/mobile/app,apps/mobile/components,apps/mobile/constants,apps/mobile/hooks,apps/mobile/lib,apps/mobile/stores,apps/mobile/theme,apps/mobile/types
sonar.tests=apps/api/crates,apps/api/tools,apps/mobile
sonar.test.inclusions=apps/api/**/tests/**/*.rs,apps/mobile/**/*.test.ts,apps/mobile/**/*.test.tsx,apps/mobile/__tests__/**/*.ts,apps/mobile/__tests__/**/*.tsx
sonar.exclusions=apps/api/**/tests/**,apps/api/target/**,apps/mobile/**/__tests__/**,apps/mobile/**/*.test.ts,apps/mobile/**/*.test.tsx,apps/mobile/node_modules/**,apps/mobile/ios/**,apps/mobile/android/**

sonar.typescript.tsconfigPaths=apps/mobile/tsconfig.json
sonar.javascript.lcov.reportPaths=apps/mobile/coverage/lcov.info

sonar.rust.cargo.manifestPaths=apps/api/Cargo.toml
sonar.rust.clippy.enabled=false
sonar.rust.clippyReport.reportPaths=.sonar/reports/api-clippy.json
sonar.coverageReportPaths=.sonar/reports/api-coverage.xml
